<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Marketplace icon, 128x128 — but it is rendered at ~42px in search results,
    so it is drawn for that size: one shape, thick strokes, filling the frame.
    The pause bars that flanked earlier versions read as stray marks once
    shrunk, and the name already carries the "during a gap" meaning.
  -->
  <rect width="128" height="128" rx="28" fill="#0c0f13"/>

  <g fill="none" stroke="#e3a857" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(64 65) scale(1.28) translate(-64 -64)">
    <path d="M64 36v56"/>
    <path d="M64 42c-4-6-12-8-19-5s-11 10-9 17c-7 3-11 11-9 18s9 12 16 11c1 7 8 12 15 11s12-7 12-14"/>
    <path d="M64 42c4-6 12-8 19-5s11 10 9 17c7 3 11 11 9 18s-9 12-16 11c-1 7-8 12-15 11"/>
  </g>
</svg>
